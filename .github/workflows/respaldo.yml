name: Recomendación de respaldo

# Todos los días a las 6:00 de Colombia (11:00 UTC). GitHub puede atrasar los horarios unos minutos.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recomendaciones
  cancel-in-progress: false

jobs:
  elegir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Elegir las de hoy
        run: python3 scripts/respaldo.py
      - name: Guardar
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recomendaciones.json historial.json
          git commit -m "Respaldo del $(TZ=America/Bogota date +%F)"
          git push
